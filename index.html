  <body>
    <div id="root"></div>
    <noscript>
      <main
        style="
          max-width: 640px;
          margin: 3rem auto;
          padding: 2.5rem;
          background: #fdfaf4;
          border: 1px solid rgba(201, 169, 110, 0.35);
          color: #252b3b;
          font-family: Georgia, serif;
          line-height: 1.85;
        "
      >
        <p style="color: #4a536b; font-size: 0.9rem; letter-spacing: 0.12em">
          あなたへの手紙
        </p>
        <h1 style="color: #2e3a59; font-weight: normal">Dear lovee,</h1>
        <p>
          Hi lovee. I know in the past days ga sige nakog pabuyag nimo ug sorry kung nkabasa kas
          akong chat ni Kian na makig laag ko nila unya fiesta. I swear na dili ko magpabuyag ana
          na time and keep updating you, and also all of those promises I made, I'll make sure na
          mahitabo to tanan in the near future, hehe.
        </p>
        <p>
          I hope na madawat gihapon ko nimo sag unsa ko ka buluyugan. I know I'm not talented or
          smart or rich, but I'll do my best to give you a better life in the future. Kanang kada
          mata nimo naa nay food na ready, dili ka mabalaka ug nakai lakaw kai naa kai taga hatid
          sundo ug naa kai alalay sa imong problems. I'll make sure that you will see a new view or
          perspective sa world, dili lang sa unsay atong nakita ron. Let's explore something new,
          discover new things, and many more, hayss. I'll be the happiest man alive if ikaw jud ako
          ma asawa.
        </p>
        <p>
          Love, I know I'm not as great as your first love or as smart as your greatest love, but
          I'll do things my own way. I'm not gonna try to match them. I'll surpass them, love. I
          hope that I can still be at your side even if layu ko usahay or buluyagon ko usahay
          lovee, but trust me when I say you're the only girl that made this heart beat again,
          you're the only girl that let my eyes see a clear view of my surroundings, and you're the
          only girl that freed this boy from the chains of life.
        </p>
        <p style="text-align: right; font-style: italic; color: #4a536b">Yours,</p>
        <p style="text-align: right; color: #b5485f; font-size: 1.2rem">Imong doggy Jong-jong</p>
        <p style="text-align: right; font-style: italic; color: #4a536b; font-size: 0.92rem">
          "I'll love you the way the moon glows over the earth on its darkest night, quiet, steady,
          and always there to light your way."
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
